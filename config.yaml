# Waffler Configuration

# Hotkey Configuration
hotkey:
  key: "fn"  # Fn key — hold to record, Fn+Space for sticky mode

# Audio Configuration
audio:
  sample_rate: 16000  # Hz (16kHz is optimal for speech)
  channels: 1  # Mono
  dtype: "int16"  # 16-bit audio

# Notification Configuration
notifications:
  enabled: true
  show_preview: true  # Show command preview in notification

# Logging Configuration
logging:
  enabled: true
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  # Privacy: transcript text stays out of app.log unless this is true.
  # app.log is what "Download Logs" bundles into a bug report. Turn this on
  # only to debug a transcription problem, then turn it back off.
  log_transcripts: false
