name: CI

# Lightweight test pass on every push and PR. Verifies imports + the
# styling guardrail test against the real corpus in
# tests/test_strip_hallucinations.py. We don't run the GUI / mic /
# permission tests here — those need a real macOS desktop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run JS actions on Node 24 ahead of GitHub's 2026-06-02 forced cutover —
# checkout@v4 / setup-python@v5 still ship on the now-deprecated Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Static analysis (pyflakes)
        # This step used to end in `|| echo "no lint findings"`, so it exited 0
        # whatever pyflakes reported and no finding could ever fail CI. It had
        # been reporting `app.py: undefined name 'subprocess'` - a real
        # NameError in download_logs(), swallowed at runtime by a bare except.
        #
        # `undefined name` is the class that becomes a crash in production, so
        # it now HARD-FAILS. Cosmetic findings (unused imports/locals,
        # platform-gated branches) are printed but do not fail, because the
        # macOS runner legitimately sees Windows-only code as unused.
        run: |
          RAW=$(python -m pyflakes src/*.py app.py || true)
          FATAL=$(echo "$RAW" | grep -E 'undefined name' | grep -vE 'overlay_process_windows|windows_hotkey|wintypes' || true)
          COSMETIC=$(echo "$RAW" | grep -vE 'undefined name' || true)
          if [ -n "$COSMETIC" ]; then echo "--- non-fatal findings ---"; echo "$COSMETIC"; fi
          if [ -n "$FATAL" ]; then
            echo "--- FATAL: undefined names (NameErrors waiting to happen) ---"
            echo "$FATAL"
            echo "::error::pyflakes found undefined name(s)"
            exit 1
          fi
          echo "no fatal lint findings"

      - name: Import every src module (catches any reference / dependency regression)
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import importlib, glob, sys, os
          sys.path.insert(0, 'src')
          mods = sorted(p.replace('src/', '').replace('.py', '') for p in glob.glob('src/*.py') if '__init__' not in p)
          fails = []
          for m in mods:
              if m in ('overlay_process_windows', 'windows_hotkey'):
                  print(f'  skip {m} (windows-only)')
                  continue
              try:
                  importlib.import_module(m)
                  print(f'    OK {m}')
              except Exception as e:
                  fails.append((m, e))
                  print(f'  FAIL {m}: {type(e).__name__}: {e}')
          sys.exit(1 if fails else 0)
          "

      - name: Styling guardrail test
        env:
          PYTHONPATH: src
        run: python tests/test_strip_hallucinations.py

      - name: Whisper-hallucination filter test
        env:
          PYTHONPATH: src
        run: python tests/test_and_more_hallucination.py

      - name: Fn-handler chatter test (macOS event-tap state machine)
        env:
          PYTHONPATH: src
        run: python tests/test_fn_handler_chatter.py

      - name: Audio stream lifecycle stress test
        # Stress-reproduces the wizard → pipeline handoff SIGSEGV pattern
        # fixed in v3.14.14/15: 50 serial then 20 overlapping
        # AudioRecorder create → start_monitoring → shutdown cycles. Any
        # regression in src/audio.py's _STREAM_LOCK serialisation or the
        # 5-step teardown sequence would re-introduce the CoreAudio HAL
        # thread firing into a freed CFFI closure → process abort. The
        # test takes ~12 s wall-clock and doesn't require microphone
        # permission (the InputStream lifecycle is what matters, not
        # what samples come out).
        env:
          PYTHONPATH: src
        run: python tests/test_audio_stream_lifecycle.py

      - name: Offline test suite (pytest)
        # The steps above invoke individual files by name, so a test file added
        # later is simply never run by CI - and one of them invoked a hardcoded
        # list of functions that had drifted out of sync with its module.
        # Running the whole suite covers new regression tests automatically.
        # tests/conftest.py keeps the live benchmark scripts out of collection,
        # so this needs no API keys and touches no private history.
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      - name: Transcript privacy gate test
        # logging.log_transcripts sat in config.yaml for months with no code
        # reading it, while v3.14.79's wizard path sliced 80 characters of the
        # user's speech into app.log - the file "Download Logs" ships to
        # whoever they send a bug report to. These tests pin the gate shut and
        # fail if a raw transcript slice ever comes back.
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_log_transcripts.py -q

      - name: CHANGELOG matches src/__init__.py version
        # Catches the easy mistake of bumping __version__ and shipping a tag
        # without adding the corresponding CHANGELOG entry. CHANGELOG drift
        # has happened in v3.14.x already (v3.14.39 was tagged and DMG'd
        # before its CHANGELOG entry landed); this is the cheapest possible
        # guard against repeating it.
        run: |
          VER=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' src/__init__.py | tr -d '"' | head -1)
          if [ -z "$VER" ]; then echo "::error::Could not parse __version__ from src/__init__.py"; exit 1; fi
          if ! grep -q "^## \[$VER\]" CHANGELOG.md; then
            echo "::error::src/__init__.py is v$VER but CHANGELOG.md has no '## [$VER]' entry."
            echo "::error::Add a CHANGELOG section for v$VER before shipping."
            exit 1
          fi
          echo "✓ CHANGELOG.md has an entry for v$VER"

      - name: Doc-drift guard
        # Catches the recurring user-facing-string bugs found across the
        # v3.14.x audit (wrong styler fallback order, stale model names).
        # Each check carries a one-line why-and-fix in the script itself
        # for when CI fails. Add ' # doc-drift-ok' to a line for legitimate
        # historical/cost-constant references that should be exempt.
        run: python scripts/check_doc_drift.py

  # The macOS job skips every Windows-only module, so the updater batch
  # generation, the low-level hotkey handler and the Windows installer paths
  # had no CI coverage at all - on a product that ships a Windows build.
  check-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_windows.txt
          pip install pytest pyflakes

      - name: Offline test suite (pytest)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      - name: Static analysis (undefined names only)
        run: |
          $raw = python -m pyflakes src/*.py app.py
          $fatal = $raw | Select-String 'undefined name'
          if ($fatal) { $fatal; Write-Error 'pyflakes found undefined name(s)'; exit 1 }
          Write-Output 'no fatal lint findings'
