[pytest]
# The offline suite is tests/ and nothing else. scripts/ holds live harnesses
# named test_*.py (the self-correction and vocabulary corpora, and local
# one-off scripts) that load real API keys, read private history or call
# providers when imported. A bare `python -m pytest` from the repo root used to
# collect them too; this keeps it identical to CI's `python -m pytest tests/`.
testpaths = tests
